name: Continuum CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run engine:test
      - run: npm run engine:typecheck
      - run: npm run engine:build
      - run: npm run app:typecheck
      - run: npm run app:export:web
